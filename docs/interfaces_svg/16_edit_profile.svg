<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-label="EditProfileScreen" width="100%" height="100%" style="display:block;width:100%;height:100%;max-width:100%;max-height:100%;">
<defs>
<clipPath id="clip-editprofilescreen"><rect x="0" y="0" width="360" height="800"/></clipPath>
</defs>
<style>
svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.t { font-family: Arial, Helvetica, sans-serif; fill: #8B5E3C; }
.ts { font-family: Arial, Helvetica, sans-serif; fill: #9C7355; }
.tp { font-family: Arial, Helvetica, sans-serif; fill: #C4A484; }
.tw { font-family: Arial, Helvetica, sans-serif; fill: #FFFFFF; }
.tl { font-family: Arial, Helvetica, sans-serif; fill: #A0714F; }
</style>
<g id="screen" clip-path="url(#clip-editprofilescreen)">
<rect x="0" y="0" width="100%" height="100%" fill="#FFF8F0"/>
<rect x="0" y="0" width="360" height="56" rx="0" fill="#FFFFFF"/>
<text x="20" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">←</text>
<text x="48" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">Editar perfil</text>
<circle cx="180" cy="130" r="48" fill="#F5D1B3"/>
<text x="180" y="200" class="ts" font-size="13" font-weight="normal" text-anchor="middle">Toca para cambiar foto</text>
<text x="24" y="240" class="t" font-size="16" font-weight="bold" text-anchor="start">Nombre Completo</text>
<rect x="24" y="250" width="312" height="52" rx="10" fill="#FFFFFF" stroke="#E8C4A8" stroke-width="1"/>
<text x="40" y="282" class="tp" font-size="16" font-weight="normal" text-anchor="start">Maria Lopez</text>
<text x="24" y="330" class="t" font-size="16" font-weight="bold" text-anchor="start">Correo Electronico</text>
<rect x="24" y="340" width="312" height="52" rx="10" fill="#FFFFFF" stroke="#E8C4A8" stroke-width="1"/>
<text x="40" y="372" class="tp" font-size="16" font-weight="normal" text-anchor="start">maria@correo.com (bloqueado)</text>
<rect x="24" y="700" width="312" height="52" rx="14" fill="#8B5E3C"/>
<text x="180" y="732" class="tw" font-size="15" font-weight="bold" text-anchor="middle">Guardar cambios</text>
