<rect x="20" y="68" width="320" height="180" rx="18" fill="#F5D1B3" stroke="#D4A373" stroke-width="2"/>
<rect x="20" y="262" width="320" height="100" rx="14" fill="#FFFFFF" stroke="#D4A373" stroke-width="2"/>
<text x="36" y="290" class="t" font-size="14" font-weight="bold" text-anchor="start">Diagnostico IA</text>
<text x="36" y="316" class="ts" font-size="15" font-weight="normal" text-anchor="start">Enfermedad: Onicomicosis</text>
