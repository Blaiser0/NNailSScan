<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-label="ChangePasswordScreen" width="100%" height="100%" style="display:block;width:100%;height:100%;max-width:100%;max-height:100%;">
<defs>
<clipPath id="clip-changepasswordscreen"><rect x="0" y="0" width="360" height="800"/></clipPath>
</defs>
<style>
svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.t { font-family: Arial, Helvetica, sans-serif; fill: #8B5E3C; }
.ts { font-family: Arial, Helvetica, sans-serif; fill: #9C7355; }
.tp { font-family: Arial, Helvetica, sans-serif; fill: #C4A484; }
.tw { font-family: Arial, Helvetica, sans-serif; fill: #FFFFFF; }
.tl { font-family: Arial, Helvetica, sans-serif; fill: #A0714F; }
</style>
<g id="screen" clip-path="url(#clip-changepasswordscreen)">
<rect x="0" y="0" width="100%" height="100%" fill="#FFF8F0"/>
<rect x="0" y="0" width="360" height="56" rx="0" fill="#FFFFFF"/>
<text x="20" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">←</text>
<text x="48" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">Cambiar contrasena</text>
<text x="24" y="90" class="ts" font-size="13" font-weight="normal" text-anchor="start">Minimo 8 caracteres con mayuscula, numero y simbolo.</text>
<text x="24" y="130" class="t" font-size="16" font-weight="bold" text-anchor="start">Nueva Contrasena</text>
<rect x="24" y="140" width="312" height="52" rx="10" fill="#FFFFFF" stroke="#E8C4A8" stroke-width="1"/>
<text x="40" y="172" class="tp" font-size="16" font-weight="normal" text-anchor="start">********</text>
<text x="24" y="220" class="t" font-size="16" font-weight="bold" text-anchor="start">Confirmar Contrasena</text>
<rect x="24" y="230" width="312" height="52" rx="10" fill="#FFFFFF" stroke="#E8C4A8" stroke-width="1"/>
<text x="40" y="262" class="tp" font-size="16" font-weight="normal" text-anchor="start">********</text>
<rect x="24" y="700" width="312" height="52" rx="14" fill="#8B5E3C"/>
<text x="180" y="732" class="tw" font-size="15" font-weight="bold" text-anchor="middle">Cambiar Contrasena</text>
</g></svg>