<circle cx="180" cy="200" r="48" fill="#F5D1B3"/>
<text x="180" y="210" class="t" font-size="36" font-weight="bold" text-anchor="middle">✓</text>
<text x="180" y="280" class="t" font-size="18" font-weight="bold" text-anchor="middle">Correo verificado correctamente</text>
<text x="180" y="310" class="ts" font-size="14" font-weight="normal" text-anchor="middle">Crea tu nueva contrasena en la app</text>
<rect x="24" y="700" width="312" height="52" rx="14" fill="#8B5E3C"/>
<text x="180" y="732" class="tw" font-size="15" font-weight="bold" text-anchor="middle">Continuar</text>
</g></svg>