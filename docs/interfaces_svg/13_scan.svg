<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-label="ScanScreen" width="100%" height="100%" style="display:block;width:100%;height:100%;max-width:100%;max-height:100%;">
<defs>
<clipPath id="clip-scanscreen"><rect x="0" y="0" width="360" height="800"/></clipPath>
</defs>
<style>
svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.t { font-family: Arial, Helvetica, sans-serif; fill: #8B5E3C; }
.ts { font-family: Arial, Helvetica, sans-serif; fill: #9C7355; }
.tp { font-family: Arial, Helvetica, sans-serif; fill: #C4A484; }
.tw { font-family: Arial, Helvetica, sans-serif; fill: #FFFFFF; }
.tl { font-family: Arial, Helvetica, sans-serif; fill: #A0714F; }
</style>
<g id="screen" clip-path="url(#clip-scanscreen)">
<rect x="0" y="0" width="100%" height="100%" fill="#FFF8F0"/>
<rect x="0" y="0" width="360" height="56" rx="0" fill="#FFFFFF"/>
<text x="20" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">←</text>
<text x="48" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">Analizar una</text>
<rect x="24" y="200" width="312" height="52" rx="14" fill="#8B5E3C"/>
<text x="180" y="232" class="tw" font-size="15" font-weight="bold" text-anchor="middle">Seleccionar imagen de galeria</text>
<rect x="24" y="270" width="312" height="52" rx="14" fill="#8B5E3C"/>
<text x="180" y="302" class="tw" font-size="15" font-weight="bold" text-anchor="middle">Tomar foto con camara</text>
</g></svg>