<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-label="WelcomeScreen" width="100%" height="100%" style="display:block;width:100%;height:100%;max-width:100%;max-height:100%;">
<defs>
<clipPath id="clip-welcomescreen"><rect x="0" y="0" width="360" height="800"/></clipPath>
</defs>
<style>
svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.t { font-family: Arial, Helvetica, sans-serif; fill: #8B5E3C; }
.ts { font-family: Arial, Helvetica, sans-serif; fill: #9C7355; }
.tp { font-family: Arial, Helvetica, sans-serif; fill: #C4A484; }
.tw { font-family: Arial, Helvetica, sans-serif; fill: #FFFFFF; }
.tl { font-family: Arial, Helvetica, sans-serif; fill: #A0714F; }
</style>
<g id="screen" clip-path="url(#clip-welcomescreen)">
<rect x="0" y="0" width="100%" height="100%" fill="#FFF8F0"/>
<circle cx="180" cy="320" r="60" fill="#F5D1B3" stroke="#E8C4A8" stroke-width="1"/>
<text x="180" y="408" text-anchor="middle" class="t" font-size="28" font-weight="bold"><tspan fill="#8B5E3C">Nail</tspan><tspan fill="#F5D1B3">Scan</tspan></text>
<text x="180" y="432" class="ts" font-size="14" font-weight="normal" text-anchor="middle">Tu salud ungueal, al instante</text>
</g></svg>