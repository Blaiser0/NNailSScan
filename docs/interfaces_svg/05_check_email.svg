<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-label="CheckEmailScreen" width="100%" height="100%" style="display:block;width:100%;height:100%;max-width:100%;max-height:100%;">
<defs>
<clipPath id="clip-checkemailscreen"><rect x="0" y="0" width="360" height="800"/></clipPath>
</defs>
<style>
svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.t { font-family: Arial, Helvetica, sans-serif; fill: #8B5E3C; }
.ts { font-family: Arial, Helvetica, sans-serif; fill: #9C7355; }
.tp { font-family: Arial, Helvetica, sans-serif; fill: #C4A484; }
.tw { font-family: Arial, Helvetica, sans-serif; fill: #FFFFFF; }
.tl { font-family: Arial, Helvetica, sans-serif; fill: #A0714F; }
</style>
<g id="screen" clip-path="url(#clip-checkemailscreen)">
<rect x="0" y="0" width="100%" height="100%" fill="#FFF8F0"/>
<rect x="0" y="0" width="360" height="56" rx="0" fill="#FFFFFF"/>
<text x="20" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">←</text>
<text x="48" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">Revisa tu correo</text>
<text x="24" y="90" class="ts" font-size="15" font-weight="normal" text-anchor="start">Revisa tu bandeja de entrada.</text>
<circle cx="180" cy="200" r="48" fill="#F5D1B3"/>
<text x="180" y="210" class="t" font-size="32" font-weight="bold" text-anchor="middle">@</text>
<text x="180" y="280" class="ts" font-size="14" font-weight="normal" text-anchor="middle">Abre el enlace en este dispositivo</text>
<text x="180" y="720" class="t" font-size="13" font-weight="normal" text-anchor="middle">Esperando verificacion...</text>
</g></svg>