<rect x="24" y="326" width="312" height="100" rx="16" fill="#FFFFFF"/>
<text x="44" y="354" class="t" font-size="18" font-weight="bold" text-anchor="start">Proposito</text>
<text x="44" y="378" class="ts" font-size="13"><tspan x="44" dy="0">Herramienta informativa para detectar</tspan><tspan x="44" dy="18">patrones en unas.</tspan></text>
