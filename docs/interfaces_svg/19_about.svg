<text x="48" y="36" class="t" font-size="22" font-weight="bold" text-anchor="start">Acerca de NailScan</text>
<circle cx="180" cy="110" r="40" fill="#F5D1B3" stroke="#E8C4A8" stroke-width="1"/>
<text x="180" y="178" text-anchor="middle" class="t" font-size="28" font-weight="bold"><tspan fill="#8B5E3C">Nail</tspan><tspan fill="#F5D1B3">Scan</tspan></text>
<text x="180" y="202" class="ts" font-size="14" font-weight="normal" text-anchor="middle">Tu salud ungueal, al instante</text>
<rect x="24" y="230" width="312" height="80" rx="16" fill="#FFFFFF"/>
