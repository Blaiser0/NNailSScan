<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>About - NailScan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #FFF8F0;
      font-family: Arial, sans-serif;
    }
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid #E8C4A8;
      backdrop-filter: blur(8px);
    }
    .toolbar a {
      color: #8B5E3C;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .toolbar span {
      color: #9C7355;
      font-size: 14px;
    }
    .stage {
      width: 100%;
      min-height: 100dvh;
      padding: 56px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone {
      width: min(100%, calc((100dvh - 68px) * 360 / 800));
      max-width: 480px;
      aspect-ratio: 360 / 800;
      margin: 0 auto;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(139, 94, 60, 0.18);
      border: 1px solid #E8C4A8;
      background: #FFF8F0;
    }
    .phone object {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
    @media (max-width: 480px) {
      .phone {
        width: 100%;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
        border: 0;
      }
      .stage { padding: 56px 0 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html">← Indice</a>
    <span>About</span>
  </div>
  <main class="stage">
    <div class="phone">
      <object data="19_about.svg" type="image/svg+xml" aria-label="About"></object>
    </div>
  </main>
</body>
</html>
