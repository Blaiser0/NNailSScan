<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800" preserveAspectRatio="xMidYMid meet" overflow="hidden" role="img" aria-label="LoginScreen" width="100%" height="100%" style="display:block;width:100%;height:100%;max-width:100%;max-height:100%;">
<defs>
<clipPath id="clip-loginscreen"><rect x="0" y="0" width="360" height="800"/></clipPath>
</defs>
<style>
svg { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; }
.t { font-family: Arial, Helvetica, sans-serif; fill: #8B5E3C; }
.ts { font-family: Arial, Helvetica, sans-serif; fill: #9C7355; }
.tp { font-family: Arial, Helvetica, sans-serif; fill: #C4A484; }
.tw { font-family: Arial, Helvetica, sans-serif; fill: #FFFFFF; }
.tl { font-family: Arial, Helvetica, sans-serif; fill: #A0714F; }
</style>
<g id="screen" clip-path="url(#clip-loginscreen)">
<rect x="0" y="0" width="100%" height="100%" fill="#FFF8F0"/>
<circle cx="180" cy="125" r="45" fill="#F5D1B3" stroke="#E8C4A8" stroke-width="1"/>
<text x="180" y="198" text-anchor="middle" class="t" font-size="28" font-weight="bold"><tspan fill="#8B5E3C">Nail</tspan><tspan fill="#F5D1B3">Scan</tspan></text>
<text x="24" y="220" class="t" font-size="16" font-weight="bold" text-anchor="start">Correo Electronico</text>
<rect x="24" y="230" width="312" height="52" rx="10" fill="#FFFFFF" stroke="#E8C4A8" stroke-width="1"/>
<text x="40" y="262" class="tp" font-size="16" font-weight="normal" text-anchor="start">tu@correo.com</text>
<text x="24" y="300" class="t" font-size="16" font-weight="bold" text-anchor="start">Contrasena</text>
<rect x="24" y="310" width="312" height="52" rx="10" fill="#FFFFFF" stroke="#E8C4A8" stroke-width="1"/>
<text x="40" y="342" class="tp" font-size="16" font-weight="normal" text-anchor="start">********</text>
<rect x="24" y="390" width="312" height="52" rx="14" fill="#8B5E3C"/>
<text x="180" y="422" class="tw" font-size="15" font-weight="bold" text-anchor="middle">Iniciar Sesion</text>
<text x="180" y="470" class="tl" font-size="14" font-weight="normal" text-anchor="middle">Olvidaste tu contrasena?</text>
<text x="180" y="500" class="ts" font-size="14" font-weight="normal" text-anchor="middle">No tienes cuenta? Registrate</text>
